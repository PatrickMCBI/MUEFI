<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Student Registration | MUEFI</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    :root {
      --muefi-red: #9b1c1c;
      --muefi-dark: #6f1212;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(
          135deg,
          rgba(155, 28, 28, 0.08),
          rgba(111, 18, 18, 0.03)
        );
    }

    .register-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 15px;
    }

    .register-card {
      width: 100%;
      max-width: 480px;
      border: 0;
      border-radius: 18px;
      box-shadow:
        0 15px 45px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }

    .register-header {
      background: var(--muefi-red);
      color: #fff;
      padding: 28px 25px;
      text-align: center;
    }

    .register-header h2 {
      margin: 0;
      font-weight: 700;
    }

    .register-header p {
      margin: 8px 0 0;
      opacity: 0.9;
      font-size: 14px;
    }

    .register-body {
      padding: 30px;
      background: #fff;
    }

    .form-label {
      font-weight: 600;
    }

    .form-control {
      min-height: 48px;
      border-radius: 10px;
    }

    .form-control:focus {
      border-color: var(--muefi-red);
      box-shadow:
        0 0 0 0.2rem rgba(155, 28, 28, 0.15);
    }

    .btn-register {
      min-height: 50px;
      border: 0;
      border-radius: 10px;
      background: var(--muefi-red);
      color: #fff;
      font-weight: 600;
    }

    .btn-register:hover {
      background: var(--muefi-dark);
      color: #fff;
    }

    .login-link {
      color: var(--muefi-red);
      font-weight: 600;
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }

    .info-box {
      background: #f8f9fa;
      border-radius: 10px;
      padding: 14px;
      font-size: 13px;
      color: #555;
      margin-bottom: 20px;
    }

    .alert {
      border-radius: 10px;
    }

    .loading {
      display: none;
    }

    .loading.show {
      display: inline-block;
    }
  </style>
</head>

<body>

<div class="register-wrapper">

  <div class="card register-card">

    <div class="register-header">
      <h2>Student Registration</h2>
      <p>MUEFI Student Portal</p>
    </div>

    <div class="register-body">

      <div class="info-box">
        Enter your <strong>Student ID</strong> and
        <strong>Full Name</strong> exactly as recorded
        by the school. You will then create your
        Student Portal PIN.
      </div>

      <div
        id="alertBox"
        class="alert d-none"
        role="alert"
      ></div>

      <form id="registerForm">

        <div class="mb-3">
          <label
            for="studentId"
            class="form-label"
          >
            Student ID
          </label>

          <input
            type="text"
            id="studentId"
            name="studentId"
            class="form-control"
            placeholder="Enter Student ID"
            autocomplete="username"
            maxlength="50"
            required
          >
        </div>

        <div class="mb-3">
          <label
            for="fullName"
            class="form-label"
          >
            Full Name
          </label>

          <input
            type="text"
            id="fullName"
            name="fullName"
            class="form-control"
            placeholder="Enter your full name"
            autocomplete="name"
            maxlength="150"
            required
          >

          <div class="form-text">
            Use the same name registered with the school.
          </div>
        </div>

        <div class="mb-3">
          <label
            for="pin"
            class="form-label"
          >
            Create PIN
          </label>

          <input
            type="password"
            id="pin"
            name="pin"
            class="form-control"
            placeholder="4–12 digit PIN"
            inputmode="numeric"
            autocomplete="new-password"
            minlength="4"
            maxlength="12"
            pattern="[0-9]{4,12}"
            required
          >
        </div>

        <div class="mb-4">
          <label
            for="confirmPin"
            class="form-label"
          >
            Confirm PIN
          </label>

          <input
            type="password"
            id="confirmPin"
            name="confirmPin"
            class="form-control"
            placeholder="Re-enter your PIN"
            inputmode="numeric"
            autocomplete="new-password"
            minlength="4"
            maxlength="12"
            pattern="[0-9]{4,12}"
            required
          >
        </div>

        <button
          type="submit"
          id="registerButton"
          class="btn btn-register w-100"
        >
          <span id="buttonText">
            Create Student Account
          </span>

          <span
            id="loading"
            class="spinner-border spinner-border-sm loading"
            aria-hidden="true"
          ></span>
        </button>

      </form>

      <div class="text-center mt-4">

        <span class="text-muted">
          Already registered?
        </span>

        <a
          href="/portal/"
          class="login-link"
        >
          Login here
        </a>

      </div>

    </div>

  </div>

</div>

<script>
  const form =
    document.getElementById(
      "registerForm"
    );

  const alertBox =
    document.getElementById(
      "alertBox"
    );

  const registerButton =
    document.getElementById(
      "registerButton"
    );

  const buttonText =
    document.getElementById(
      "buttonText"
    );

  const loading =
    document.getElementById(
      "loading"
    );

  function showAlert(
    message,
    type = "danger"
  ) {
    alertBox.className =
      `alert alert-${type}`;

    alertBox.textContent =
      message;
  }

  function hideAlert() {
    alertBox.className =
      "alert d-none";

    alertBox.textContent = "";
  }

  function setLoading(
    loadingState
  ) {
    registerButton.disabled =
      loadingState;

    if (loadingState) {
      buttonText.textContent =
        "Creating account...";

      loading.classList.add(
        "show"
      );
    } else {
      buttonText.textContent =
        "Create Student Account";

      loading.classList.remove(
        "show"
      );
    }
  }

  form.addEventListener(
    "submit",
    async (event) => {
      event.preventDefault();

      hideAlert();

      const studentId =
        document
          .getElementById(
            "studentId"
          )
          .value
          .trim();

      const fullName =
        document
          .getElementById(
            "fullName"
          )
          .value
          .trim();

      const pin =
        document
          .getElementById(
            "pin"
          )
          .value
          .trim();

      const confirmPin =
        document
          .getElementById(
            "confirmPin"
          )
          .value
          .trim();

      if (
        !studentId ||
        !fullName ||
        !pin ||
        !confirmPin
      ) {
        showAlert(
          "Please complete all fields."
        );

        return;
      }

      if (!/^\d{4,12}$/.test(pin)) {
        showAlert(
          "PIN must contain 4 to 12 digits."
        );

        return;
      }

      if (pin !== confirmPin) {
        showAlert(
          "PINs do not match."
        );

        return;
      }

      setLoading(true);

      try {
        const response =
          await fetch(
            "/api/register",
            {
              method: "POST",

              credentials: "same-origin",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                studentId,
                fullName,
                pin,
                confirmPin
              })
            }
          );

        let data;

        try {
          data =
            await response.json();
        } catch {
          throw new Error(
            "The server returned an invalid response."
          );
        }

        if (!response.ok) {
          throw new Error(
            data.error ||
            "Registration failed."
          );
        }

        showAlert(
          data.message ||
          "Registration successful.",
          "success"
        );

        form.reset();

        setTimeout(() => {
          window.location.href =
            "/portal/";
        }, 1800);

      } catch (error) {
        console.error(
          "Registration error:",
          error
        );

        showAlert(
          error.message ||
          "Unable to process registration."
        );

      } finally {
        setLoading(false);
      }
    }
  );
</script>

</body>
</html>
