<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Portal | MUEFI</title>
<style>
:root{ /* TODO: replace these with the real colors and font from the existing muefi-edu.com CSS */
  --brand:#9b1c1c; --brand-dark:#6f1212; --ink:#1f2933; --muted:#667085; --line:#e4e7ec; --bg:#f6f7f9;
  --font:system-ui,-apple-system,"Segoe UI","Noto Sans SC",sans-serif; }
*{box-sizing:border-box}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.5;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
header,footer{background:#fff}
header{border-bottom:1px solid var(--line)}
footer{border-top:1px solid var(--line);padding:20px;text-align:center;color:var(--muted);font-size:.9rem}
.bar{max-width:1100px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.logo{font-weight:800;font-size:1.25rem;color:var(--brand);margin-right:auto}
nav{display:flex;gap:18px;flex-wrap:wrap;font-size:.95rem}
nav a:hover{color:var(--brand)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
main{flex:1;width:100%;max-width:1100px;margin:32px auto;padding:0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:28px}
#login{max-width:420px;margin:40px auto}
h1{margin:0 0 6px;font-size:1.5rem}
.sub{color:var(--muted);margin:0 0 20px}
label{display:block;font-weight:600;margin:14px 0 6px;font-size:.9rem}
input,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-weight:600;width:100%;margin-top:20px}
.btn:hover{background:var(--brand-dark)}
.link{background:none;border:0;color:var(--brand);font-weight:600;padding:4px}
.err{color:#b42318;margin:12px 0 0;min-height:1.4em}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.tools{display:flex;gap:12px;align-items:center}
.tools select,#lang{width:auto}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--muted);font-weight:600}
td.g{font-variant-numeric:tabular-nums;font-weight:600}
[hidden]{display:none!important}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:28px}
.stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px}
.stat b{display:block;font-size:1.8rem;color:var(--brand)}
.stat span{color:var(--muted);font-size:.85rem}
.tabs2{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.tabs2 button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 16px;font-weight:600;color:var(--muted)}
.tabs2 button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.panel{display:none}.panel.on{display:block}
.row2{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;margin-bottom:18px}
.row2 label{margin:0 0 4px}
.row2 .btn{margin:0;width:auto;padding:10px 16px}
@media(max-width:900px){.row2{grid-template-columns:1fr 1fr}}
tr.inactive{opacity:.5}
.chip{border:0;background:var(--bg);border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:600;color:var(--ink);margin-right:4px}
.pin{font-family:monospace}
.msg{min-height:1.4em;margin:0 0 14px;font-weight:600}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="/">MUEFI</a>
  <nav>
    <a href="/home">Home</a><a href="/about">About</a><a href="/event">Event</a><a href="/admission">Admission</a><a href="/ssc">SSC</a><a href="/alumni">Alumni</a><a href="/contact">Contact</a>
  </nav>
</div></header>

<main>
  <form id="login" class="card">
    <h1>Admin Portal</h1>
    <p class="sub">Sign in to manage students and teachers.</p>
    <label for="aid">Admin ID</label>
    <input id="aid" autocomplete="username" required>
    <label for="pin">PIN</label>
    <input id="pin" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button class="btn">Sign in</button>
  </form>

  <section id="work" hidden>
    <div class="head">
      <div><h1 id="who"></h1><p class="sub">School overview and roster management</p></div>
      <button class="link" id="out">Log out</button>
    </div>

    <div class="cards" id="cards"></div>

    <div class="tabs2">
      <button class="on" data-p="students">Students</button>
      <button data-p="teachers">Teachers</button>
    </div>

    <div id="p-students" class="panel on card">
      <h1>Students</h1>
      <p class="msg" id="smsg" role="status"></p>
      <form id="sform" class="row2">
        <input type="hidden" id="s-mode" value="add">
        <div><label for="s-id">Student ID</label><input id="s-id" required></div>
        <div><label for="s-pin">PIN</label><input id="s-pin" class="pin" inputmode="numeric" placeholder="4-8 digits"></div>
        <div><label for="s-name">Full name</label><input id="s-name" required></div>
        <div><label for="s-level">Level</label><input id="s-level" placeholder="Grade 3"></div>
        <div><label for="s-section">Section</label><input id="s-section" placeholder="A"></div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="s-save" type="submit" style="flex:1">Add student</button>
          <button class="btn" id="s-cancel" type="button" hidden style="background:#667085;flex:0 0 auto">Cancel</button>
        </div>
      </form>
      <div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Level</th><th>Section</th><th>PIN</th><th>Status</th><th></th></tr></thead><tbody id="s-body"></tbody></table></div>
    </div>

    <div id="p-teachers" class="panel card">
      <h1>Teachers</h1>
      <p class="msg" id="tmsg" role="status"></p>
      <form id="tform" class="row2">
        <input type="hidden" id="t-mode" value="add">
        <div><label for="t-id">Teacher ID</label><input id="t-id" required></div>
        <div><label for="t-pin">PIN</label><input id="t-pin" class="pin" inputmode="numeric" placeholder="4-8 digits"></div>
        <div><label for="t-name">Name</label><input id="t-name" required></div>
        <div><label for="t-classes">Classes</label><input id="t-classes" placeholder="Grade 1-A, Grade 1-B or *"></div>
        <div><label for="t-subjects">Subjects</label><input id="t-subjects" placeholder="Mathematics, Chinese or *"></div>
        <div style="display:flex;gap:8px">
          <button class="btn" id="t-save" type="submit" style="flex:1">Add teacher</button>
          <button class="btn" id="t-cancel" type="button" hidden style="background:#667085;flex:0 0 auto">Cancel</button>
        </div>
      </form>
      <div class="wrap"><table><thead><tr><th>ID</th><th>Name</th><th>Classes</th><th>Subjects</th><th>PIN</th><th></th></tr></thead><tbody id="t-body"></tbody></table></div>
    </div>
  </section>
</main>

<footer>
  (088) 521 0042<br>
  © MUEFI, All Right Reserved. Designed By <a href="https://kodewrk.com"><u>Kodewrk</u></a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const cell = (tag, text, cls) => { const c = document.createElement(tag); c.textContent = text; if (cls) c.className = cls; return c; };
const btn = (text, on) => { const b = document.createElement('button'); b.className = 'chip'; b.type = 'button'; b.textContent = text; b.onclick = on; return b; };

async function api(url, body) {
  const r = await fetch(url, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : undefined);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Something went wrong. Please try again.');
  return d;
}

async function loadDashboard() {
  const d = await api('/api/admin/dashboard');
  $('who').textContent = `Welcome, ${d.admin}`;
  const stats = [
    ['Students', d.students.total], ['Active students', d.students.active],
    ['Teachers', d.teachers.total], ['Classes', d.classes],
  ];
  if (d.newInquiries !== null) stats.push(['New inquiries', d.newInquiries]);
  $('cards').replaceChildren(...stats.map(([label, n]) => {
    const c = document.createElement('div'); c.className = 'stat';
    c.append(cell('b', n), cell('span', label)); return c;
  }));
}

async function loadStudents() {
  const { students } = await api('/api/admin/students');
  $('s-body').replaceChildren(...students.map((s) => {
    const tr = document.createElement('tr'); if (!s.active) tr.className = 'inactive';
    tr.append(cell('td', s.id), cell('td', s.name), cell('td', s.level), cell('td', s.section), cell('td', s.pin, 'pin'), cell('td', s.active ? 'Active' : 'Inactive'));
    const td = document.createElement('td');
    td.append(btn('Edit', () => {
      $('s-mode').value = 'edit'; $('s-id').value = s.id; $('s-id').disabled = true; $('s-pin').value = '';
      $('s-pin').placeholder = 'Leave blank to keep current PIN'; $('s-name').value = s.name; $('s-level').value = s.level; $('s-section').value = s.section;
      $('s-save').textContent = 'Save changes'; $('s-cancel').hidden = false; $('sform').scrollIntoView({ behavior: 'smooth' });
    }), btn(s.active ? 'Deactivate' : 'Activate', async () => {
      try { await api('/api/admin/students', { id: s.id, name: s.name, level: s.level, section: s.section, active: !s.active }); await loadStudents(); }
      catch (e) { $('smsg').textContent = e.message; $('smsg').style.color = '#b42318'; }
    }));
    tr.append(td); return tr;
  }));
}

async function loadTeachers() {
  const { teachers } = await api('/api/admin/teachers');
  $('t-body').replaceChildren(...teachers.map((t) => {
    const tr = document.createElement('tr');
    tr.append(cell('td', t.id), cell('td', t.name), cell('td', t.classes), cell('td', t.subjects), cell('td', t.pin, 'pin'));
    const td = document.createElement('td');
    td.append(btn('Edit', () => {
      $('t-mode').value = 'edit'; $('t-id').value = t.id; $('t-id').disabled = true; $('t-pin').value = '';
      $('t-pin').placeholder = 'Leave blank to keep current PIN'; $('t-name').value = t.name; $('t-classes').value = t.classes; $('t-subjects').value = t.subjects;
      $('t-save').textContent = 'Save changes'; $('t-cancel').hidden = false; $('tform').scrollIntoView({ behavior: 'smooth' });
    }));
    tr.append(td); return tr;
  }));
}

function resetForm(prefix) {
  $(prefix + 'form').reset(); $(prefix[0] + '-mode').value = 'add'; $(prefix[0] + '-id').disabled = false;
  $(prefix[0] + '-pin').placeholder = '4-8 digits';
  $(prefix[0] + '-save').textContent = prefix === 's' ? 'Add student' : 'Add teacher';
  $(prefix[0] + '-cancel').hidden = true;
}

$('sform').onsubmit = async (e) => {
  e.preventDefault(); $('smsg').textContent = '';
  try {
    await api('/api/admin/students', { id: $('s-id').value, pin: $('s-pin').value, name: $('s-name').value, level: $('s-level').value, section: $('s-section').value });
    resetForm('s'); await loadStudents(); $('smsg').style.color = '#067647'; $('smsg').textContent = 'Saved.';
  } catch (err) { $('smsg').style.color = '#b42318'; $('smsg').textContent = err.message; }
};
$('s-cancel').onclick = () => resetForm('s');

$('tform').onsubmit = async (e) => {
  e.preventDefault(); $('tmsg').textContent = '';
  try {
    await api('/api/admin/teachers', { id: $('t-id').value, pin: $('t-pin').value, name: $('t-name').value, classes: $('t-classes').value, subjects: $('t-subjects').value });
    resetForm('t'); await loadTeachers(); $('tmsg').style.color = '#067647'; $('tmsg').textContent = 'Saved.';
  } catch (err) { $('tmsg').style.color = '#b42318'; $('tmsg').textContent = err.message; }
};
$('t-cancel').onclick = () => resetForm('t');

document.querySelectorAll('.tabs2 button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs2 button').forEach((x) => x.classList.toggle('on', x === b));
  document.querySelectorAll('.panel').forEach((p) => p.classList.toggle('on', p.id === 'p-' + b.dataset.p));
});

async function start() {
  try { await loadDashboard(); } catch { return false; }
  $('login').hidden = true; $('work').hidden = false;
  await Promise.all([loadStudents(), loadTeachers()]);
  return true;
}

$('login').onsubmit = async (e) => {
  e.preventDefault(); $('err').textContent = '';
  try {
    await api('/api/admin/login', { adminId: $('aid').value, pin: $('pin').value });
    $('pin').value = '';
    if (!(await start())) $('err').textContent = 'Something went wrong. Please try again.';
  } catch (err) { $('err').textContent = err.message; }
};

$('out').onclick = async () => { await fetch('/api/admin/logout', { method: 'POST' }); $('work').hidden = true; $('login').hidden = false; };
start();
</script>
</body>
</html>
