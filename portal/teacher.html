<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Teacher Portal | MUEFI</title>

  <style>
    :root {
      --brand: #9b1c1c;
      --brand-dark: #6f1212;
      --ink: #1f2933;
      --muted: #667085;
      --line: #e4e7ec;
      --bg: #f6f7f9;
      --success: #067647;
      --danger: #b42318;

      --font:
        system-ui,
        -apple-system,
        "Segoe UI",
        "Noto Sans SC",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--ink);
      background: var(--bg);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header,
    footer {
      background: #fff;
    }

    header {
      border-bottom: 1px solid var(--line);
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 20px;
      text-align: center;
      color: var(--muted);
      font-size: .9rem;
    }

    footer a {
      color: var(--brand);
      text-decoration: none;
    }

    .bar {
      max-width: 1200px;
      margin: auto;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-weight: 800;
      font-size: 1.25rem;
      color: var(--brand);
      margin-right: auto;
      text-decoration: none;
    }

    main {
      flex: 1;
      width: 100%;
      max-width: 1200px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
    }

    #login {
      max-width: 420px;
      margin: 40px auto;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.5rem;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 1.2rem;
    }

    .sub {
      color: var(--muted);
      margin: 0 0 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin: 14px 0 6px;
      font-size: .9rem;
    }

    input,
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
      background: #fff;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--brand);
      box-shadow:
        0 0 0 3px rgba(155, 28, 28, .08);
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn {
      background: var(--brand);
      color: #fff;
      border: 0;
      border-radius: 8px;
      padding: 12px 18px;
      font-weight: 600;
    }

    .btn:hover:not(:disabled) {
      background: var(--brand-dark);
    }

    .btn.full {
      width: 100%;
      margin-top: 20px;
    }

    .btn.secondary {
      background: #fff;
      color: var(--brand);
      border: 1px solid var(--brand);
    }

    .btn.secondary:hover:not(:disabled) {
      background: #fff7f7;
    }

    .btn.small {
      padding: 8px 12px;
      font-size: .875rem;
    }

    .err {
      color: var(--danger);
      margin: 12px 0 0;
      min-height: 1.4em;
    }

    .success {
      color: var(--success);
      min-height: 1.4em;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .teacher-info {
      color: var(--muted);
      margin: 0;
    }

    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .layout {
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 20px;
    }

    .students {
      max-height: 600px;
      overflow-y: auto;
    }

    .student {
      width: 100%;
      text-align: left;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      transition: .15s ease;
    }

    .student:hover,
    .student.active {
      border-color: var(--brand);
      background: #fff7f7;
    }

    .student strong {
      display: block;
      margin-bottom: 3px;
    }

    .student small {
      color: var(--muted);
    }

    .grade-grid {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: .85rem;
    }

    td input,
    td select {
      min-width: 110px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: var(--muted);
    }

    .text-danger {
      color: var(--danger);
    }

    .loading {
      opacity: .6;
      pointer-events: none;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 800px) {

      main {
        margin: 16px auto;
        padding: 0 12px;
      }

      .card {
        padding: 18px;
      }

      .filters {
        grid-template-columns: 1fr;
      }

      .layout {
        grid-template-columns: 1fr;
      }

      .students {
        max-height: 300px;
      }

      .top {
        flex-direction: column;
      }

      .top .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- HEADER -->

  <header>
    <div class="bar">

      <a
        class="logo"
        href="/"
      >
        MUEFI
      </a>

      <strong>
        Teacher Portal
      </strong>

    </div>
  </header>


  <!-- MAIN -->

  <main>

    <!-- =========================================
         LOGIN
    ========================================== -->

    <form
      id="login"
      class="card"
    >

      <h1>
        Teacher Login
      </h1>

      <p class="sub">
        Sign in to manage student grades.
      </p>

      <label for="teacherId">
        Teacher ID
      </label>

      <input
        id="teacherId"
        autocomplete="username"
        required
      >

      <label for="pin">
        PIN
      </label>

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        autocomplete="current-password"
        required
      >

      <p
        id="loginError"
        class="err"
        role="alert"
      ></p>

      <button
        id="loginButton"
        class="btn full"
        type="submit"
      >
        Login
      </button>

    </form>


    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <section
      id="dashboard"
      hidden
    >

      <!-- TOP -->

      <div class="top">

        <div>

          <h1>
            Teacher Dashboard
          </h1>

          <p
            id="teacherInfo"
            class="teacher-info"
          ></p>

        </div>

        <button
          id="logout"
          class="btn secondary"
          type="button"
        >
          Log out
        </button>

      </div>


      <!-- =======================================
           FILTERS
      ======================================== -->

      <div class="card">

        <div class="filters">

          <!-- SCHOOL YEAR -->

          <div>

            <label for="schoolYear">
              School Year
            </label>

            <select
              id="schoolYear"
              required
            >

              <option value="2026-2027">
                2026-2027
              </option>

            </select>

          </div>


          <!-- QUARTER -->

          <div>

            <label for="quarter">
              Quarter
            </label>

            <select id="quarter">

              <option value="Q1">
                Q1
              </option>

              <option value="Q2">
                Q2
              </option>

              <option value="Q3">
                Q3
              </option>

              <option value="Q4">
                Q4
              </option>

            </select>

          </div>


          <!-- GRADE LEVEL -->

          <div>

            <label for="gradeLevel">
              Grade Level
            </label>

            <select
              id="gradeLevel"
              required
            >

              <option value="">
                Select Grade Level
              </option>

            </select>

          </div>

        </div>

      </div>


      <!-- =======================================
           STUDENTS + GRADES
      ======================================== -->

      <div
        class="layout"
        style="margin-top:20px;"
      >

        <!-- =====================================
             STUDENTS
        ====================================== -->

        <div class="card">

          <h2>
            Students
          </h2>

          <p class="sub">
            Select a student.
          </p>

          <div
            id="students"
            class="students"
          >

            <div class="empty">
              Select a grade level.
            </div>

          </div>

        </div>


        <!-- =====================================
             GRADES
        ====================================== -->

        <div class="card">

          <h2 id="studentName">
            Select a student
          </h2>

          <p
            id="studentMeta"
            class="sub"
          ></p>

          <p
            id="saveMessage"
            class="success"
          ></p>

          <div class="grade-grid">

            <table>

              <thead>

                <tr>
                  <th>Quarter</th>
                  <th>Subject</th>
                  <th>Grade</th>
                  <th>Remarks</th>
                  <th>Action</th>
                </tr>

              </thead>

              <tbody id="gradeBody">

                <tr>

                  <td
                    colspan="5"
                    class="empty"
                  >
                    Select a student.
                  </td>

                </tr>

              </tbody>

            </table>

          </div>


          <div class="actions">

            <button
              id="addGrade"
              class="btn secondary"
              type="button"
            >
              + Add Subject
            </button>

          </div>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->

  <footer>

    © MUEFI, All Rights Reserved.
    Designed By

    <a
      href="https://kodewrk.com"
      target="_blank"
      rel="noopener"
    >
      <u>Kodewrk</u>
    </a>

  </footer>


  <script>

    // ==========================================
    // HELPERS
    // ==========================================

    const $ = (id) =>
      document.getElementById(id);


    let teacher = null;

    let selectedStudent = null;

    let grades = [];


    const subjects = [
      'Chinese',
      'English',
      'Filipino',
      'Mathematics',
      'Science',
      'Araling Panlipunan',
      'MAPEH',
      'TLE',
      'ESP'
    ];


    // ==========================================
    // API HELPER
    // ==========================================

    async function api(
      url,
      options = {}
    ) {

      const response =
        await fetch(
          url,
          {
            ...options,
            credentials: 'same-origin'
          }
        );


      let data = {};


      try {

        data =
          await response.json();

      } catch {

        data = {};

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          data.message ||
          `Request failed (${response.status})`
        );

      }


      return data;
    }


    // ==========================================
    // LOGIN
    // ==========================================

    async function login(event) {

      event.preventDefault();


      $('loginError')
        .textContent = '';


      const teacherId =
        $('teacherId')
          .value
          .trim();


      const pin =
        $('pin')
          .value
          .trim();


      if (!teacherId || !pin) {

        $('loginError')
          .textContent =
            'Please enter your Teacher ID and PIN.';

        return;
      }


      const button =
        $('loginButton');


      button.disabled = true;

      button.textContent =
        'Signing in...';


      try {

        const data =
          await api(
            '/api/teacher/login',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json',

                'Accept':
                  'application/json'
              },

              body:
                JSON.stringify({
                  teacherId,
                  pin
                })
            }
          );


        teacher =
          data.teacher;


        if (!teacher) {

          throw new Error(
            'Invalid teacher response.'
          );

        }


        // Populate assigned grade levels

        populateGradeLevels(
          teacher
        );


        // Clear PIN

        $('pin').value = '';


        // Switch screen

        $('login').hidden =
          true;

        $('dashboard').hidden =
          false;


        // Teacher information

        const gradeCount =
          Array.isArray(
            teacher.gradeLevels
          )
            ? teacher.gradeLevels.length
            : 0;


        $('teacherInfo')
          .textContent =
            `${teacher.name}` +
            (
              teacher.section
                ? ` · Section ${teacher.section}`
                : ''
            ) +
            ` · ${gradeCount} grade level${gradeCount === 1 ? '' : 's'}`;


        // Load first grade

        await loadStudents();

      } catch (error) {

        console.error(
          'LOGIN ERROR:',
          error
        );


        if (
          error.message ===
          'locked'
        ) {

          $('loginError')
            .textContent =
              'Too many attempts. Try again later.';

        } else if (
          error.message ===
          'no_grade_assignment'
        ) {

          $('loginError')
            .textContent =
              'This teacher has no assigned grade level.';

        } else {

          $('loginError')
            .textContent =
              error.message ||
              'Teacher ID or PIN is incorrect.';

        }

      } finally {

        button.disabled =
          false;

        button.textContent =
          'Login';

      }
    }


    // ==========================================
    // POPULATE GRADE LEVELS
    // ==========================================

    function populateGradeLevels(
      teacher
    ) {

      const select =
        $('gradeLevel');


      select.innerHTML = '';


      let gradeLevels =
        teacher.gradeLevels ||
        teacher.grade_level ||
        [];


      // Support comma-separated value

      if (
        typeof gradeLevels ===
        'string'
      ) {

        gradeLevels =
          gradeLevels
            .split(',')
            .map(
              value =>
                value.trim()
            )
            .filter(Boolean);

      }


      if (
        !Array.isArray(
          gradeLevels
        )
      ) {

        gradeLevels = [];

      }


      // Remove duplicates

      gradeLevels = [
        ...new Set(
          gradeLevels
        )
      ];


      // Sort numerically

      gradeLevels.sort(
        (a, b) => {

          const numA =
            parseInt(
              String(a)
                .replace(
                  /\D/g,
                  ''
                ),
              10
            ) || 999;


          const numB =
            parseInt(
              String(b)
                .replace(
                  /\D/g,
                  ''
                ),
              10
            ) || 999;


          return numA - numB;
        }
      );


      if (
        gradeLevels.length === 0
      ) {

        const option =
          document.createElement(
            'option'
          );

        option.value = '';

        option.textContent =
          'No grade assigned';

        select.appendChild(
          option
        );

        select.disabled =
          true;

        return;
      }


      select.disabled =
        false;


      gradeLevels.forEach(
        grade => {

          const option =
            document.createElement(
              'option'
            );


          option.value =
            grade;


          option.textContent =
            grade;


          select.appendChild(
            option
          );

        }
      );


      select.value =
        gradeLevels[0];
    }


    // ==========================================
    // LOAD STUDENTS
    // ==========================================

    async function loadStudents() {

      const gradeLevel =
        $('gradeLevel')
          .value
          .trim();


      const schoolYear =
        $('schoolYear')
          .value
          .trim();


      const container =
        $('students');


      // Reset selected student

      selectedStudent =
        null;

      grades = [];


      $('studentName')
        .textContent =
          'Select a student';


      $('studentMeta')
        .textContent = '';


      $('saveMessage')
        .textContent = '';


      $('gradeBody')
        .innerHTML = `
          <tr>
            <td
              colspan="5"
              class="empty"
            >
              Select a student.
            </td>
          </tr>
        `;


      if (!gradeLevel) {

        container.innerHTML = `
          <div class="empty">
            Select a grade level.
          </div>
        `;

        return;
      }


      if (!schoolYear) {

        container.innerHTML = `
          <div class="empty text-danger">
            Please select a school year.
          </div>
        `;

        return;
      }


      container.innerHTML = `
        <div class="empty">
          Loading students...
        </div>
      `;


      console.log(
        'LOAD STUDENTS REQUEST:',
        {
          gradeLevel,
          schoolYear
        }
      );


      try {

        const params =
          new URLSearchParams({
            gradeLevel,
            schoolYear
          });


        const url =
          `/api/teacher/students?${params.toString()}`;


        console.log(
          'LOAD STUDENTS URL:',
          url
        );


        const response =
          await fetch(
            url,
            {
              method: 'GET',

              credentials:
                'same-origin',

              headers: {
                Accept:
                  'application/json'
              }
            }
          );


        const data =
          await response.json();


        console.log(
          'LOAD STUDENTS STATUS:',
          response.status
        );


        console.log(
          'LOAD STUDENTS DATA:',
          data
        );


        if (!response.ok) {

          throw new Error(
            data.message ||
            data.error ||
            `Failed to load students (${response.status})`
          );

        }


        renderStudents(
          data.students || []
        );

      } catch (error) {

        console.error(
          'LOAD STUDENTS ERROR:',
          error
        );


        container.innerHTML = `
          <div class="empty text-danger">
            ${escapeHtml(
              error.message
            )}
          </div>
        `;

      }
    }


    // ==========================================
    // RENDER STUDENTS
    // ==========================================

    function renderStudents(
      students
    ) {

      const container =
        $('students');


      container.innerHTML = '';


      if (!students.length) {

        container.innerHTML = `
          <div class="empty">
            No students found.
          </div>
        `;

        return;
      }


      students.forEach(
        student => {

          const button =
            document.createElement(
              'button'
            );


          button.type =
            'button';


          button.className =
            'student';


          button.dataset.id =
            student.id;


          button.innerHTML = `
            <strong>
              ${escapeHtml(
                student.name
              )}
            </strong>

            <small>
              ${escapeHtml(
                student.id
              )}
              ·
              ${escapeHtml(
                student.gradeLevel
              )}
              ${
                student.section
                  ? ` · Section ${escapeHtml(student.section)}`
                  : ''
              }
            </small>
          `;


          button.addEventListener(
            'click',
            () =>
              selectStudent(
                student
              )
          );


          container.appendChild(
            button
          );

        }
      );
    }


    // ==========================================
    // SELECT STUDENT
    // ==========================================

    async function selectStudent(
      student
    ) {

      selectedStudent =
        student;


      document
        .querySelectorAll(
          '.student'
        )
        .forEach(
          button => {

            button.classList.toggle(
              'active',
              button.dataset.id ===
                String(student.id)
            );

          }
        );


      $('studentName')
        .textContent =
          student.name;


      $('studentMeta')
        .textContent =
          `${student.id} · ` +
          `${student.gradeLevel}` +
          (
            student.section
              ? ` · Section ${student.section}`
              : ''
          );


      $('saveMessage')
        .textContent = '';


      await loadGrades();
    }


    // ==========================================
    // LOAD GRADES
    // ==========================================

    async function loadGrades() {

      if (
        !selectedStudent ||
        !selectedStudent.id
      ) {

        $('gradeBody')
          .innerHTML = `
            <tr>
              <td
                colspan="5"
                class="empty"
              >
                Select a student.
              </td>
            </tr>
          `;

        return;
      }


      const studentId =
        String(
          selectedStudent.id
        ).trim();


      const schoolYear =
        String(
          $('schoolYear').value
        ).trim();


      const params =
        new URLSearchParams();


      params.set(
        'studentId',
        studentId
      );


      params.set(
        'schoolYear',
        schoolYear
      );


      const url =
        `/api/teacher/grades?${params.toString()}`;


      console.log(
        'LOAD GRADES URL:',
        url
      );


      try {

        $('gradeBody')
          .innerHTML = `
            <tr>
              <td
                colspan="5"
                class="empty"
              >
                Loading grades...
              </td>
            </tr>
          `;


        const response =
          await fetch(
            url,
            {
              method: 'GET',

              headers: {
                Accept:
                  'application/json'
              },

              credentials:
                'same-origin'
            }
          );


        const raw =
          await response.text();


        console.log(
          'LOAD GRADES STATUS:',
          response.status
        );


        console.log(
          'LOAD GRADES RAW:',
          raw
        );


        let data;


        try {

          data =
            JSON.parse(raw);

        } catch {

          throw new Error(
            `Server returned invalid response: ${raw.substring(0, 200)}`
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            data.message ||
            `Failed to load grades (${response.status})`
          );

        }


        grades =
          (data.grades || [])
            .filter(
              grade =>
                String(
                  grade.quarter
                ).trim() ===
                String(
                  $('quarter').value
                ).trim()
            );


        renderGrades();

      } catch (error) {

        console.error(
          'LOAD GRADES ERROR:',
          error
        );


        $('gradeBody')
          .innerHTML = `
            <tr>
              <td
                colspan="5"
                class="empty text-danger"
              >
                ${escapeHtml(
                  error.message ||
                  'Failed to load grades.'
                )}
              </td>
            </tr>
          `;


        $('saveMessage')
          .textContent =
            error.message ||
            'Failed to load grades.';
      }
    }


    // ==========================================
    // RENDER GRADES
    // ==========================================

    function renderGrades() {

      const body =
        $('gradeBody');


      body.replaceChildren();


      if (!selectedStudent) {

        body.innerHTML = `
          <tr>
            <td
              colspan="5"
              class="empty"
            >
              Select a student.
            </td>
          </tr>
        `;

        return;
      }


      if (!grades.length) {

        body.innerHTML = `
          <tr>
            <td
              colspan="5"
              class="empty"
            >
              No grades recorded for
              ${escapeHtml(
                $('quarter').value
              )}.
            </td>
          </tr>
        `;

        return;
      }


      grades.forEach(
        (grade) => {

          const tr =
            document.createElement(
              'tr'
            );


          // QUARTER

          const quarter =
            document.createElement(
              'td'
            );


          quarter.textContent =
            grade.quarter ||
            $('quarter').value;


          // SUBJECT

          const subject =
            document.createElement(
              'td'
            );


          const subjectSelect =
            document.createElement(
              'select'
            );


          subjects.forEach(
            name => {

              const option =
                document.createElement(
                  'option'
                );


              option.value =
                name;


              option.textContent =
                name;


              if (
                name.toLowerCase() ===
                String(
                  grade.subject || ''
                ).toLowerCase()
              ) {

                option.selected =
                  true;

              }


              subjectSelect.appendChild(
                option
              );

            }
          );


          subject.appendChild(
            subjectSelect
          );


          // GRADE

          const gradeCell =
            document.createElement(
              'td'
            );


          const gradeInput =
            document.createElement(
              'input'
            );


          gradeInput.type =
            'number';


          gradeInput.min =
            '0';


          gradeInput.max =
            '100';


          gradeInput.step =
            '0.01';


          gradeInput.value =
            grade.grade ?? '';


          gradeCell.appendChild(
            gradeInput
          );


          // REMARKS

          const remarksCell =
            document.createElement(
              'td'
            );


          const remarksInput =
            document.createElement(
              'input'
            );


          remarksInput.value =
            grade.remarks ?? '';


          remarksCell.appendChild(
            remarksInput
          );


          // ACTION

          const actionCell =
            document.createElement(
              'td'
            );


          const saveButton =
            document.createElement(
              'button'
            );


          saveButton.type =
            'button';


          saveButton.className =
            'btn small';


          saveButton.textContent =
            'Save';


          saveButton.addEventListener(
            'click',
            async () => {

              await saveGrade({
                subject:
                  subjectSelect.value,

                grade:
                  gradeInput.value,

                remarks:
                  remarksInput.value
              });

            }
          );


          actionCell.appendChild(
            saveButton
          );


          tr.append(
            quarter,
            subject,
            gradeCell,
            remarksCell,
            actionCell
          );


          body.appendChild(
            tr
          );

        }
      );
    }


    // ==========================================
    // ADD SUBJECT
    // ==========================================

    $('addGrade')
      .addEventListener(
        'click',
        () => {

          if (!selectedStudent) {

            alert(
              'Please select a student first.'
            );

            return;
          }


          const quarter =
            $('quarter').value;


          grades.push({

            quarter,

            subject:
              subjects[0],

            grade: '',

            remarks: ''

          });


          renderGrades();
        }
      );


    // ==========================================
    // SAVE GRADE
    // ==========================================

    async function saveGrade(
      grade
    ) {

      if (
        !selectedStudent ||
        !selectedStudent.id
      ) {

        $('saveMessage')
          .textContent =
            'Please select a student first.';

        return;
      }


      const numericGrade =
        Number(
          grade.grade
        );


      if (
        grade.grade === '' ||
        !Number.isFinite(
          numericGrade
        ) ||
        numericGrade < 0 ||
        numericGrade > 100
      ) {

        $('saveMessage')
          .textContent =
            'Grade must be between 0 and 100.';

        return;
      }


      $('saveMessage')
        .textContent =
          'Saving...';


      const payload = {

        studentId:
          selectedStudent.id,

        schoolYear:
          $('schoolYear').value,

        quarter:
          $('quarter').value,

        subject:
          grade.subject,

        grade:
          numericGrade,

        remarks:
          grade.remarks

      };


      console.log(
        'SAVE PAYLOAD:',
        payload
      );


      try {

        const response =
          await fetch(
            '/api/teacher/grades',
            {
              method: 'POST',

              headers: {
                'Content-Type':
                  'application/json',

                Accept:
                  'application/json'
              },

              credentials:
                'same-origin',

              body:
                JSON.stringify(
                  payload
                )
            }
          );


        const raw =
          await response.text();


        console.log(
          'SAVE STATUS:',
          response.status
        );


        console.log(
          'SAVE RAW RESPONSE:',
          raw
        );


        let data;


        try {

          data =
            JSON.parse(raw);

        } catch {

          throw new Error(
            `Server returned invalid response: ${raw.substring(0, 200)}`
          );

        }


        if (!response.ok) {

          throw new Error(
            data.error ||
            data.message ||
            `Save failed (${response.status})`
          );

        }


        $('saveMessage')
          .textContent =
            data.message ||
            'Grade saved successfully.';


        await loadGrades();

      } catch (error) {

        console.error(
          'SAVE ERROR:',
          error
        );


        $('saveMessage')
          .textContent =
            error.message ||
            'Failed to save grade.';
      }
    }


    // ==========================================
    // GRADE LEVEL CHANGE
    // ==========================================

    $('gradeLevel')
      .addEventListener(
        'change',
        async () => {

          await loadStudents();

        }
      );


    // ==========================================
    // SCHOOL YEAR CHANGE
    // ==========================================

    $('schoolYear')
      .addEventListener(
        'change',
        async () => {

          await loadStudents();

        }
      );


    // ==========================================
    // QUARTER CHANGE
    // ==========================================

    $('quarter')
      .addEventListener(
        'change',
        async () => {

          if (selectedStudent) {

            await loadGrades();

          }

        }
      );


    // ==========================================
    // LOGOUT
    // ==========================================

    $('logout')
      .addEventListener(
        'click',
        async () => {

          try {

            await fetch(
              '/api/logout',
              {
                method: 'POST',
                credentials:
                  'same-origin'
              }
            );

          } finally {

            location.reload();

          }
        }
      );


    // ==========================================
    // LOGIN SUBMIT
    // ==========================================

    $('login')
      .addEventListener(
        'submit',
        login
      );


    // ==========================================
    // HTML ESCAPE
    // ==========================================

    function escapeHtml(
      value
    ) {

      return String(
        value ?? ''
      )
        .replace(
          /&/g,
          '&amp;'
        )
        .replace(
          /</g,
          '&lt;'
        )
        .replace(
          />/g,
          '&gt;'
        )
        .replace(
          /"/g,
          '&quot;'
        )
        .replace(
          /'/g,
          '&#039;'
        );
    }

  </script>

</body>
